# Mosquitto configuration for pcwake.
#
#   sudo cp install/pi/mosquitto/pcwake.conf /etc/mosquitto/conf.d/
#   sudo cp install/pi/mosquitto/aclfile /etc/mosquitto/
#   sudo mosquitto_passwd -c /etc/mosquitto/pcwake.passwd hub
#   sudo mosquitto_passwd    /etc/mosquitto/pcwake.passwd agent
#   sudo chown mosquitto: /etc/mosquitto/pcwake.passwd /etc/mosquitto/aclfile
#   sudo chmod 600 /etc/mosquitto/pcwake.passwd
#   sudo systemctl restart mosquitto

# Bind to the LAN only. Change to the Pi's LAN address, or drop the address
# to listen on every interface -- but never expose 1883 to the internet:
# there is no TLS here, so the credentials would cross the network in clear.
listener 1883

# Anonymous clients could read your PC's status and power it off, so the
# broker requires credentials from everyone.
allow_anonymous false
password_file /etc/mosquitto/pcwake.passwd
acl_file /etc/mosquitto/aclfile

# Retained status must survive a broker restart, otherwise the hub comes back
# knowing nothing until each agent happens to reconnect.
persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type warning
log_type error
